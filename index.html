<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Unser Sonnensystem</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="space" aria-label="Interaktive Karte des Sonnensystems"></canvas>

  <header class="topbar">
    <div class="title">
      <span class="logo" aria-hidden="true">🪐</span>
      <div>
        <h1>Unser Sonnensystem</h1>
        <p class="sub" id="modeSub">Klick auf einen Planeten – deine Rakete fliegt hin! 🚀</p>
      </div>
    </div>
    <div class="modes" role="tablist">
      <button data-mode="orbit" class="active">🪐 Sonnensystem</button>
      <button data-mode="size">📏 Größen</button>
      <button data-mode="stars">⭐ Nachbarsterne</button>
      <button data-mode="galaxy">🌌 Milchstraße</button>
    </div>
  </header>

  <section class="card time-panel" id="timePanel">
    <div class="time"><span aria-hidden="true">⏱️</span> <span id="timeText">0 Tage</span></div>
    <div class="speed">
      <button id="playBtn" class="round" title="Anhalten / Weiter">⏸️</button>
      <span aria-hidden="true">🐢</span>
      <input type="range" id="speed" min="0" max="9" step="1" value="1" aria-label="Geschwindigkeit">
      <span aria-hidden="true">🚀</span>
    </div>
    <div class="speed-text" id="speedText"></div>
    <div class="toggles">
      <label><input type="checkbox" id="tOrbits" checked> Umlaufbahnen</label>
      <label><input type="checkbox" id="tNames" checked> Namen</label>
    </div>
  </section>

  <div class="zoom-controls">
    <button id="zoomIn" class="round" title="Hineinzoomen">+</button>
    <button id="zoomOut" class="round" title="Herauszoomen">−</button>
    <button id="tiltBtn" class="round" title="Kippen und Drehen: danach ziehen">🔄</button>
    <button id="homeBtn" class="round" title="Alles zeigen (nochmal drücken: gerade ausrichten)">🔭</button>
  </div>

  <p class="note" id="note"></p>

  <button id="levelHint" class="level-hint"></button>

  <nav class="planet-bar" id="planetBar" aria-label="Planeten"></nav>

  <aside id="info" class="info" aria-hidden="true">
    <button class="close round" id="closeInfo" title="Schließen">✕</button>
    <div class="info-head">
      <canvas id="infoPic" width="110" height="110"></canvas>
      <div>
        <span class="kind" id="infoKind"></span>
        <h2 id="infoName"></h2>
        <button id="speakBtn" class="pill">🔊 Vorlesen</button>
      </div>
    </div>
    <p class="intro" id="infoIntro"></p>
    <p class="tip" id="infoTip"></p>
    <div class="facts" id="infoFacts"></div>
    <div class="fun">
      <strong>⭐ Wusstest du?</strong>
      <p id="infoFun"></p>
    </div>
    <div class="compare" id="compareBox">
      <strong id="cmpTitle">📐 So groß im Vergleich zur Erde</strong>
      <canvas id="cmp"></canvas>
      <p id="infoCompare"></p>
    </div>
    <button id="backBtn" class="pill big back">🔭 Zurück zur Übersicht</button>
  </aside>

  <script src="js/earth.js"></script>
  <script src="js/data.js"></script>
  <script src="js/space.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
